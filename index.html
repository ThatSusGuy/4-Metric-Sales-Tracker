<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Tracker</title>
  <style>
    :root {
      --bg: #0e0f12;
      --card: #16181d;
      --card-border: #23262d;
      --text: #f4f5f7;
      --muted: #8a8f99;
      --accent: #6ee7b7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .updated {
      font-size: 13px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      main { padding: 32px 16px; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 28px 28px 24px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .label {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .value {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-top: 14px;
      color: var(--text);
    }
    .value .unit {
      font-size: 28px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 4px;
    }
    .sub {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .sub strong { color: var(--text); font-weight: 600; }
    .error {
      grid-column: 1 / -1;
      padding: 20px;
      border: 1px solid #5a2330;
      background: #2a1418;
      border-radius: 12px;
      color: #f6b9c0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Sales Tracker</h1>
      <div class="updated" id="updated">Loading…</div>
    </header>
    <section class="grid" id="grid"></section>
  </main>

  <script>
    const fmtMoney = (n) => {
      if (n == null || isNaN(n)) return "—";
      return "$" + Math.round(n).toLocaleString("en-US");
    };
    const fmtPct = (n) => {
      if (n == null || isNaN(n)) return "—";
      return (n * 100).toFixed(1) + "%";
    };
    const fmtInt = (n) => {
      if (n == null || isNaN(n)) return "—";
      return Math.round(n).toLocaleString("en-US");
    };
    const fmtDate = (iso) => {
      if (!iso) return "";
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    };

    async function load() {
      const grid = document.getElementById("grid");
      const updated = document.getElementById("updated");
      try {
        const res = await fetch("data.json?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const m = data.metrics || {};

        const cards = [
          {
            label: "Current Streak",
            value: fmtInt(m.streak?.current),
            unit: (m.streak?.current === 1 ? "day" : "days"),
            sub: `Record: <strong>${fmtInt(m.streak?.record)} days</strong>`
              + (m.streak?.recordEndedOn ? ` (ended ${fmtDate(m.streak.recordEndedOn)})` : "")
          },
          {
            label: "Top Contract Value (this week)",
            value: fmtMoney(m.contractValueWeek?.current),
            unit: "",
            sub: `All-time record: <strong>${fmtMoney(m.contractValueWeek?.record)}</strong>`
              + (m.contractValueWeek?.recordDate ? ` (${fmtDate(m.contractValueWeek.recordDate)})` : "")
          },
          {
            label: "Top Cash Collected (this week)",
            value: fmtMoney(m.cashCollectedWeek?.current),
            unit: "",
            sub: `All-time record: <strong>${fmtMoney(m.cashCollectedWeek?.record)}</strong>`
              + (m.cashCollectedWeek?.recordDate ? ` (${fmtDate(m.cashCollectedWeek.recordDate)})` : "")
          },
          {
            label: "Close Rate (this week)",
            value: fmtPct(m.closeRateWeek?.current),
            unit: "",
            sub: (() => {
              const c = m.closeRateWeek?.currentCloses, g = m.closeRateWeek?.currentGpCalls;
              const ratio = (c != null && g != null) ? ` (${fmtInt(c)} / ${fmtInt(g)})` : "";
              const rec = `Best week: <strong>${fmtPct(m.closeRateWeek?.record)}</strong>`;
              const recWk = m.closeRateWeek?.recordWeekStart ? ` (week of ${fmtDate(m.closeRateWeek.recordWeekStart)})` : "";
              return ratio + (ratio ? " · " : "") + rec + recWk;
            })()
          }
        ];

        grid.innerHTML = cards.map(c => `
          <div class="card">
            <div class="label">${c.label}</div>
            <div class="value">${c.value}${c.unit ? `<span class="unit">${c.unit}</span>` : ""}</div>
            <div class="sub">${c.sub}</div>
          </div>
        `).join("");

        if (data.generatedAt) {
          const d = new Date(data.generatedAt);
          updated.textContent = "Updated " + d.toLocaleString();
        } else {
          updated.textContent = "";
        }
      } catch (err) {
        updated.textContent = "";
        grid.innerHTML = `<div class="error">Could not load data.json: ${err.message}. Once n8n writes data.json to the repo this page will populate.</div>`;
      }
    }
    load();
  </script>
</body>
</html>
